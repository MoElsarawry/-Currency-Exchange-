<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/bootstrap.min.css" />

    <title>Currency Exchange</title>
  </head>

 <body
      class="min-vh-100 d-flex justify-content-center align-items-center p-3"
    >
      <div class="exchange-card shadow">

        <h1 class="text-center mb-4">Currency</h1>

        <div class="mb-4">
          <label for="amount" class="form-label fw-semibold">
            Amount
          </label>

          <input
            type="number"
            class="form-control form-control-lg"
            id="amount"
            value="1"
            min="0"
            step="any"
            placeholder="Enter amount"
          />
        </div>

        <div class="currency-box mb-3">

          <select
            id="currencyFrom"
            class="form-select form-select-lg"
          ></select>

        </div>

        <div class="currency-box mb-4">

          <select
            id="currencyTo"
            class="form-select form-select-lg"
          ></select>

        </div>

        <div id="result" class="result-box text-center mb-4"></div>

        <button id="convertBtn" class="btn btn-primary btn-lg w-100">
          Convert
        </button>

        <p id="error" class="text-danger text-center mt-3"></p>

      </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/COUNTRY_NAMES.js"></script>
    <script src="js/index.js"></script>

  </body>
</html>
